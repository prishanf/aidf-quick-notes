# AIDF self-consistency check — run this on the framework repository itself,
# and on any project that vendors the framework documents.
#
# It catches the class of defect that killed AIDF v1: documents that quietly
# disagree with each other. Agents read these files literally, so a
# contradiction is not a style problem — it is a correctness problem.

name: AIDF self-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Framework consistency
        run: sh .aidf/reference/scripts/check-consistency.sh

      - name: Manifest validity (pass and fail paths)
        run: sh .aidf/reference/scripts/self-test.sh

      - name: Mermaid diagrams parse
        run: |
          npm install --no-save @mermaid-js/mermaid-cli >/dev/null 2>&1
          python3 - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          failed = []
          for path in pathlib.Path('.').rglob('*.md'):
              if 'node_modules' in path.parts:
                  continue
              for i, block in enumerate(re.findall(r'```mermaid\n(.*?)```', path.read_text(), re.S)):
                  with tempfile.NamedTemporaryFile('w', suffix='.mmd', delete=False) as fh:
                      fh.write(block)
                  rc = subprocess.call(['npx','-y','mmdc','-i',fh.name,'-o',fh.name+'.svg'],
                                       stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  if rc != 0:
                      failed.append('%s block %d' % (path, i + 1))
          if failed:
              print('Diagrams failed to parse:'); [print(' -', f) for f in failed]; sys.exit(1)
          print('All mermaid diagrams parse.')
          PY
