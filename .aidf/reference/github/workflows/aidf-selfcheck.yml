# AIDF project self-check — for repositories that *install* AIDF via
# aidf-install.sh (framework lives under .aidf/).
#
# This is NOT the framework-repo consistency suite. That suite needs
# diagrams/, examples/, and the full AIDF source tree, which are deliberately
# not vendored into projects. Running check-consistency.sh here fails looking
# for files that were never installed.
#
# Framework maintainers: use the workflow in the AIDF repository root
# (.github/workflows/aidf-selfcheck.yml), which still runs check-consistency.sh,
# self-test.sh, and Mermaid parsing against the full source tree.

name: AIDF project self-check

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  project-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate project manifest
        run: sh reference/scripts/validate-manifest.sh project.yaml
